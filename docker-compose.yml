version: '3.8'

services:
  crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odiseacloud-crm
    restart: always
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - PORT=5173
      - HOST=0.0.0.0
    volumes:
      # Persistencia de tu base de datos SQLite / D1 (18.2 MB con todas las empresas)
      - crm_data:/app/.wrangler
      # Persistencia de la sesión de WhatsApp (mantiene la vinculación tras reinicios)
      - crm_whatsapp:/app/.whatsapp_session

volumes:
  crm_data:
    name: odiseacloud_crm_data
  crm_whatsapp:
    name: odiseacloud_crm_whatsapp

